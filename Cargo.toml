[workspace]
resolver = "3"
members = ["acyclic_output_fuzz", "deterministic_output_fuzz", "output_fuzz_common"]
exclude = ["rolldown"]

[workspace.dependencies]
rolldown = { path = "rolldown/crates/rolldown" }
rolldown_common = { path = "rolldown/crates/rolldown_common" }
base64 = "0.23.1"
flate2 = "1.1.11"
oxc = "0.157.0"
proptest = "1.12.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
